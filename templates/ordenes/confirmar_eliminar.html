{% extends 'base.html' %}
{% load static %}

{% block content %}
<div id="main-content" class="bg-gradient-to-b from-sky-200 to-sky-50 pt-3 pb-12 px-8 min-h-screen transition-all duration-200">
    <div class="py-6 max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-sky-900">Confirmar Eliminación</h2>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h3 class="text-lg font-semibold mb-4 text-sky-800 border-b pb-2">Detalles de la Orden</h3>
            
            <div class="mb-6 text-center">
                <p class="text-base font-medium text-gray-700 mb-2">
                    ¿Estás seguro de que deseas eliminar esta orden?
                </p>
                <p class="text-lg font-semibold text-gray-800 mb-1">
                    ID: <span class="text-red-700 italic font-bold">{{ object.ID_OrdenTrabajo }}</span>
                </p>
                <p class="text-xl font-bold text-red-700 mb-2 italic">
                    "{{ object.Descripcion }}"
                </p>
                <p class="text-sm text-gray-500">Esta acción no se puede deshacer.</p>
            </div>


            <form method="post" class="flex justify-end gap-4">
                {% csrf_token %}


                <button type="submit"
                    style="background-color: #dc2626; color: white; border: 2px solid #991b1b; padding: 6px 16px; border-radius: 0.5rem; font-weight: 600; box-shadow: 0 3px 5px rgba(220, 38, 38, 0.5); font-size: 1rem;"
                    onmouseover="this.style.backgroundColor='#b91c1c'"
                    onmouseout="this.style.backgroundColor='#dc2626'">
                    Eliminar
                </button>


                <a href="{% url 'orden-listar' %}"
                   class="flex items-center gap-2 bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
